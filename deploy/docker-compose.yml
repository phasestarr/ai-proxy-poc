name: ai-proxy

services:
  postgres:
    image: "postgres:${POSTGRES_VERSION:?POSTGRES_VERSION is required}"
    container_name: ${AI_PROXY_POSTGRES_CONTAINER_NAME:?AI_PROXY_POSTGRES_CONTAINER_NAME is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: "redis:${REDIS_VERSION:?REDIS_VERSION is required}"
    container_name: ${AI_PROXY_REDIS_CONTAINER_NAME:?AI_PROXY_REDIS_CONTAINER_NAME is required}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:?PYTHON_VERSION is required}
        PIP_VERSION: ${PIP_VERSION:?PIP_VERSION is required}
    container_name: ${AI_PROXY_BACKEND_CONTAINER_NAME:?AI_PROXY_BACKEND_CONTAINER_NAME is required}
    environment:
      APP_NAME: ${APP_NAME:?APP_NAME is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      APP_PORT: ${APP_PORT:?APP_PORT is required}
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      REDIS_URL: redis://redis:6379/0
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:?AUTH_SESSION_COOKIE_NAME is required}
      AUTH_CONFLICT_COOKIE_NAME: ${AUTH_CONFLICT_COOKIE_NAME:?AUTH_CONFLICT_COOKIE_NAME is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:?AUTH_COOKIE_SAMESITE is required}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:?AUTH_COOKIE_PATH is required}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN?AUTH_COOKIE_DOMAIN must be set, use blank when unused}
      AUTH_DATA_ENCRYPTION_KEY: ${AUTH_DATA_ENCRYPTION_KEY:?AUTH_DATA_ENCRYPTION_KEY is required}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:?AUTH_SESSION_TTL_MINUTES is required}
      AUTH_GUEST_MAX_SESSIONS: ${AUTH_GUEST_MAX_SESSIONS:?AUTH_GUEST_MAX_SESSIONS is required}
      AUTH_MICROSOFT_MAX_SESSIONS: ${AUTH_MICROSOFT_MAX_SESSIONS:?AUTH_MICROSOFT_MAX_SESSIONS is required}
      AUTH_SESSION_LIMIT_STRATEGY: ${AUTH_SESSION_LIMIT_STRATEGY:?AUTH_SESSION_LIMIT_STRATEGY is required}
      AUTH_CONFLICT_TICKET_MINUTES: ${AUTH_CONFLICT_TICKET_MINUTES:?AUTH_CONFLICT_TICKET_MINUTES is required}
      HOUSEKEEPING_INTERVAL_MINUTES: ${HOUSEKEEPING_INTERVAL_MINUTES:?HOUSEKEEPING_INTERVAL_MINUTES is required}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS is required}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT?GOOGLE_CLOUD_PROJECT must be set, use blank when Vertex is unused}
      VERTEX_AI_API_VERSION: ${VERTEX_AI_API_VERSION:?VERTEX_AI_API_VERSION is required}
      VERTEX_AI_ATTACHMENT_GCS_BUCKET: ${VERTEX_AI_ATTACHMENT_GCS_BUCKET?VERTEX_AI_ATTACHMENT_GCS_BUCKET must be set, use blank when Vertex attachments are unused}
      VERTEX_AI_ATTACHMENT_GCS_PREFIX: ${VERTEX_AI_ATTACHMENT_GCS_PREFIX:?VERTEX_AI_ATTACHMENT_GCS_PREFIX is required}
      VERTEX_AI_RAG_CORPORA: ${VERTEX_AI_RAG_CORPORA?VERTEX_AI_RAG_CORPORA must be set, use blank when unused}
      VERTEX_AI_RAG_SIMILARITY_TOP_K: ${VERTEX_AI_RAG_SIMILARITY_TOP_K:?VERTEX_AI_RAG_SIMILARITY_TOP_K is required}
      VERTEX_AI_RAG_VECTOR_DISTANCE_THRESHOLD: ${VERTEX_AI_RAG_VECTOR_DISTANCE_THRESHOLD?VERTEX_AI_RAG_VECTOR_DISTANCE_THRESHOLD must be set, use blank when unused}
      OPENAI_API_KEY: ${OPENAI_API_KEY?OPENAI_API_KEY must be set, use blank when OpenAI is unused}
      OPENAI_VECTOR_STORE_IDS: ${OPENAI_VECTOR_STORE_IDS?OPENAI_VECTOR_STORE_IDS must be set, use blank when retrieval is unused}
      OPENAI_FILE_SEARCH_MAX_NUM_RESULTS: ${OPENAI_FILE_SEARCH_MAX_NUM_RESULTS:?OPENAI_FILE_SEARCH_MAX_NUM_RESULTS is required}
      OPENAI_FILE_SEARCH_SCORE_THRESHOLD: ${OPENAI_FILE_SEARCH_SCORE_THRESHOLD?OPENAI_FILE_SEARCH_SCORE_THRESHOLD must be set, use blank when unused}
      OPENAI_CODE_INTERPRETER_MEMORY_LIMIT: ${OPENAI_CODE_INTERPRETER_MEMORY_LIMIT:?OPENAI_CODE_INTERPRETER_MEMORY_LIMIT is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY?ANTHROPIC_API_KEY must be set, use blank when Anthropic is unused}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:?ANTHROPIC_VERSION is required}
      ANTHROPIC_WEB_SEARCH_MAX_USES: ${ANTHROPIC_WEB_SEARCH_MAX_USES:?ANTHROPIC_WEB_SEARCH_MAX_USES is required}
      ANTHROPIC_WEB_SEARCH_ALLOWED_DOMAINS: ${ANTHROPIC_WEB_SEARCH_ALLOWED_DOMAINS?ANTHROPIC_WEB_SEARCH_ALLOWED_DOMAINS must be set, use blank when unused}
      ANTHROPIC_WEB_SEARCH_BLOCKED_DOMAINS: ${ANTHROPIC_WEB_SEARCH_BLOCKED_DOMAINS?ANTHROPIC_WEB_SEARCH_BLOCKED_DOMAINS must be set, use blank when unused}
      CHAT_ATTACHMENT_REMOTE_TTL_HOURS: ${CHAT_ATTACHMENT_REMOTE_TTL_HOURS:?CHAT_ATTACHMENT_REMOTE_TTL_HOURS is required}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID?MICROSOFT_CLIENT_ID must be set, use blank when Microsoft login is unused}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET?MICROSOFT_CLIENT_SECRET must be set, use blank when Microsoft login is unused}
      MICROSOFT_AUTHORITY: ${MICROSOFT_AUTHORITY:?MICROSOFT_AUTHORITY is required}
      MICROSOFT_REDIRECT_PATH: ${MICROSOFT_REDIRECT_PATH:?MICROSOFT_REDIRECT_PATH is required}
      MICROSOFT_OAUTH_TRANSACTION_MINUTES: ${MICROSOFT_OAUTH_TRANSACTION_MINUTES:?MICROSOFT_OAUTH_TRANSACTION_MINUTES is required}
      MICROSOFT_SCOPES: ${MICROSOFT_SCOPES:?MICROSOFT_SCOPES is required}
      CHAT_DRAFT_TTL_SECONDS: ${CHAT_DRAFT_TTL_SECONDS:?CHAT_DRAFT_TTL_SECONDS is required}
      CHAT_INFLIGHT_LOCK_TTL_SECONDS: ${CHAT_INFLIGHT_LOCK_TTL_SECONDS:?CHAT_INFLIGHT_LOCK_TTL_SECONDS is required}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:?CHAT_RATE_LIMIT_PER_MINUTE is required}
      CHAT_RATE_LIMIT_PER_HOUR: ${CHAT_RATE_LIMIT_PER_HOUR:?CHAT_RATE_LIMIT_PER_HOUR is required}
      CHAT_ATTACHMENT_MAX_FILES_PER_HISTORY: ${CHAT_ATTACHMENT_MAX_FILES_PER_HISTORY:?CHAT_ATTACHMENT_MAX_FILES_PER_HISTORY is required}
      CHAT_ATTACHMENT_MAX_FILES_PER_USER: ${CHAT_ATTACHMENT_MAX_FILES_PER_USER:?CHAT_ATTACHMENT_MAX_FILES_PER_USER is required}
      CHAT_ATTACHMENT_MAX_FILE_BYTES: ${CHAT_ATTACHMENT_MAX_FILE_BYTES:?CHAT_ATTACHMENT_MAX_FILE_BYTES is required}
      CHAT_ATTACHMENT_MAX_TOTAL_BYTES_PER_HISTORY: ${CHAT_ATTACHMENT_MAX_TOTAL_BYTES_PER_HISTORY:?CHAT_ATTACHMENT_MAX_TOTAL_BYTES_PER_HISTORY is required}
      CHAT_ATTACHMENT_MAX_TOTAL_TOKENS_PER_PROVIDER: ${CHAT_ATTACHMENT_MAX_TOTAL_TOKENS_PER_PROVIDER:?CHAT_ATTACHMENT_MAX_TOTAL_TOKENS_PER_PROVIDER is required}
      STARTUP_DEPENDENCY_MAX_ATTEMPTS: ${STARTUP_DEPENDENCY_MAX_ATTEMPTS:?STARTUP_DEPENDENCY_MAX_ATTEMPTS is required}
      STARTUP_DEPENDENCY_RETRY_SECONDS: ${STARTUP_DEPENDENCY_RETRY_SECONDS:?STARTUP_DEPENDENCY_RETRY_SECONDS is required}
    volumes:
      - ../secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:?NODE_VERSION is required}
        NPM_VERSION: ${NPM_VERSION:?NPM_VERSION is required}
        NGINX_VERSION: ${NGINX_VERSION:?NGINX_VERSION is required}
    container_name: ${AI_PROXY_CONTAINER_NAME:?AI_PROXY_CONTAINER_NAME is required}
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
